services:
  selenium:
    # Use official Selenium with Chrome
    image: selenium/standalone-chrome
    # Name of the Selenium container
    container_name: selenium
    # Expose Selenium WebDriver port (host:container)
    ports:
      - "4444:4444"
    # Increase shared memory size to avoid Chrome crashes (esp. in headless mode)
    shm_size: "2g"

  tests:
    # Build Docker image from current directory (uses Dockerfile)
    build: .
    # Name of the container that runs tests
    container_name: tests
    depends_on:
      # Ensure Selenium container starts before this one
      - selenium
    volumes:
      # Mount current project folder into the container at /app
      - .:/app
      - ./logs:/app/logs
    # Set working directory inside the container
    working_dir: /app
    # Entry point — wait for Selenium, then run tests
    command: [ "/wait-for-selenium.sh" ]

    environment:
      - LOG_PATH=/app/logs
      # URL to reach Selenium from within the Docker network
      - SELENIUM_URL=http://selenium:4444/wd/hub